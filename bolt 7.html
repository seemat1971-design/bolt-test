<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BOLT Breath Awareness</title>

<style>
*{box-sizing:border-box;}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#eaf6f3;
  min-height:100vh;
  padding:16px;
  display:flex;
  justify-content:center;
  align-items:center;
}

.app{
  background:#fff;
  width:100%;
  max-width:420px;
  padding:24px;
  border-radius:16px;
  box-shadow:0 10px 25px rgba(0,0,0,.12);
  text-align:center;
}

h1,h2,h3{color:#2b7a78;margin-top:0;}
p{font-size:16px;line-height:1.6;color:#333;}

button{
  margin-top:16px;
  padding:16px;
  font-size:17px;
  width:100%;
  max-width:260px;
  border:none;
  border-radius:12px;
  background:#3baea0;
  color:#fff;
}

.box{
  background:#eef7f6;
  padding:16px;
  border-radius:12px;
  margin-top:16px;
  text-align:left;
}

.timer{
  font-size:44px;
  font-weight:bold;
  color:#1f5f5b;
  margin:20px 0;
}

.hidden{display:none;}
.footer{font-size:13px;color:#555;margin-top:16px;}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}
th,td{
  border:1px solid #cfe5e1;
  padding:8px;
  font-size:14px;
  text-align:left;
}
th{background:#dff3ee;}
</style>

<script>
var lang="";
var seconds=0;
var intervalId=null;

/* ---------- TEXT ---------- */
var TXT={
en:{
welcome:"Take a quiet minute with your breath",
l1:"No right or wrong. Just awareness.",
l2:"This helps you sense how your body handles stress.",
cont:"Continue",

instT:"How to do it",
inst:"Sit comfortably and relax.<br>Breathe normally through your nose.<br>After a normal exhale, gently hold your breath.<br>Stop at the first urge to breathe.<br><br><b>Click below when you are ready.</b>",
ready:"I’m ready",

timerT:"Breath hold",
support:"Let the body decide.",
start:"Start",
stop:"Stop",

resultT:"Your result",
disc:"This is a self-awareness tool, not a medical test.",
restart:"Restart",

table:
"<h3>What does the score mean?</h3>\
<table>\
<tr><th>Score</th><th>Meaning</th></tr>\
<tr><td>10–20 sec</td><td>Body may be in alert mode.</td></tr>\
<tr><td>20–30 sec</td><td>Balanced breathing response.</td></tr>\
<tr><td>40+ sec</td><td>Calm and adaptable system.</td></tr>\
</table>",

benefits:
"<h3>How this helps</h3>\
<p>• Better stamina</p>\
<p>• Improved sleep</p>\
<p>• Stress awareness</p>",

result:function(s){
if(s<20){return{e:"Your body may be in an alert state right now.",s:"Try slow nasal breathing for 2 minutes."};}
if(s<35){return{e:"Your body shows a fairly balanced response.",s:"Notice gentle natural breaths."};}
return{e:"Your body shows calm adaptability.",s:"Continue gentle breath awareness."};
}
},

hi:{
welcome:"अपनी साँस के साथ एक शांत मिनट",
l1:"कोई सही या गलत नहीं।",
l2:"यह आपकी बॉडी की स्थिति समझने में मदद करता है।",
cont:"आगे बढ़ें",

instT:"कैसे करें",
inst:"आराम से बैठें और सामान्य साँस लें।<br>साँस बाहर छोड़ने के बाद धीरे से रोकें।<br>पहली urge पर रोक दें।<br><br><b>जब आप तैयार हों, नीचे क्लिक करें।</b>",
ready:"मैं तैयार हूँ",

timerT:"साँस रोकें",
support:"बॉडी को तय करने दें।",
start:"शुरू करें",
stop:"रोकें",

resultT:"आपका परिणाम",
disc:"यह केवल self-awareness के लिए है।",
restart:"फिर से शुरू करें",

table:
"<h3>Score ka matlab</h3>\
<table>\
<tr><th>Score</th><th>Matlab</th></tr>\
<tr><td>10–20 sec</td><td>Body alert mode me ho sakti hai.</td></tr>\
<tr><td>20–30 sec</td><td>Balanced breathing response.</td></tr>\
<tr><td>40+ sec</td><td>Shaant aur adaptable system.</td></tr>\
</table>",

benefits:
"<h3>Isse kya fayda</h3>\
<p>• Stamina badhta hai</p>\
<p>• Behtar neend</p>\
<p>• Stress samajhne me madad</p>",

result:function(s){
if(s<20){return{e:"Abhi body thodi alert state me ho sakti hai.",s:"2 minute dheemi naak se saans lein."};}
if(s<35){return{e:"Body balanced response dikha rahi hai.",s:"Natural breathing ko notice karein."};}
return{e:"Body shaant aur adaptable hai.",s:"Is awareness ko banaye rakhein."};
}
}
};

/* ---------- HELPERS ---------- */
function hideAll(){
document.getElementById("lang").classList.add("hidden");
document.getElementById("welcome").classList.add("hidden");
document.getElementById("instructions").classList.add("hidden");
document.getElementById("timerScreen").classList.add("hidden");
document.getElementById("result").classList.add("hidden");
}

/* ---------- FLOW ---------- */
function setLang(l){
lang=l; hideAll();
document.getElementById("wTitle").innerText=TXT[l].welcome;
document.getElementById("w1").innerText=TXT[l].l1;
document.getElementById("w2").innerText=TXT[l].l2;
document.getElementById("wBtn").innerText=TXT[l].cont;
document.getElementById("welcome").classList.remove("hidden");
}

function goInstructions(){
hideAll();
document.getElementById("iTitle").innerText=TXT[lang].instT;
document.getElementById("iText").innerHTML=TXT[lang].inst;
document.getElementById("iBtn").innerText=TXT[lang].ready;
document.getElementById("instructions").classList.remove("hidden");
}

function goTimer(){
hideAll();
document.getElementById("tTitle").innerText=TXT[lang].timerT;
document.getElementById("support").innerText=TXT[lang].support;
document.getElementById("timer").innerText="0";
document.getElementById("startBtn").innerText=TXT[lang].start;
document.getElementById("stopBtn").innerText=TXT[lang].stop;
document.getElementById("startBtn").classList.remove("hidden");
document.getElementById("stopBtn").classList.add("hidden");
document.getElementById("timerScreen").classList.remove("hidden");
}

function startHold(){
seconds=0;
document.getElementById("timer").innerText="0";
document.getElementById("startBtn").classList.add("hidden");
document.getElementById("stopBtn").classList.remove("hidden");
intervalId=setInterval(function(){
seconds=seconds+1;
document.getElementById("timer").innerText=seconds;
},1000);
}

function stopHold(){
clearInterval(intervalId);
var r=TXT[lang].result(seconds);
hideAll();
document.getElementById("rTitle").innerText=TXT[lang].resultT;
document.getElementById("rExplain").innerText=r.e;
document.getElementById("rSuggest").innerText=r.s;
document.getElementById("rTable").innerHTML=TXT[lang].table;
document.getElementById("rBenefits").innerHTML=TXT[lang].benefits;
document.getElementById("rDisc").innerText=TXT[lang].disc;
document.getElementById("rBtn").innerText=TXT[lang].restart;
document.getElementById("result").classList.remove("hidden");
}

function restart(){
clearInterval(intervalId);
hideAll();
document.getElementById("lang").classList.remove("hidden");
}
</script>
</head>

<body>
<div class="app">

<div id="lang">
<h1>BOLT Breath Awareness</h1>
<p>Please choose your language<br>कृपया अपनी भाषा चुनें</p>
<button onclick="setLang('en')">English</button>
<button onclick="setLang('hi')">हिंदी</button>
<div class="footer">Created by Seema Tayal</div>
</div>

<div id="welcome" class="hidden">
<h1 id="wTitle"></h1>
<p id="w1"></p>
<p id="w2"></p>
<button id="wBtn" onclick="goInstructions()"></button>
</div>

<div id="instructions" class="hidden">
<h2 id="iTitle"></h2>
<div id="iText" class="box"></div>
<button id="iBtn" onclick="goTimer()"></button>
</div>

<div id="timerScreen" class="hidden">
<h2 id="tTitle"></h2>
<div id="timer" class="timer">0</div>
<p id="support"></p>
<button id="startBtn" onclick="startHold()"></button>
<button id="stopBtn" class="hidden" onclick="stopHold()"></button>
</div>

<div id="result" class="hidden">
<h2 id="rTitle"></h2>
<div class="box">
<p id="rExplain"></p>
<p><b>Suggestion:</b> <span id="rSuggest"></span></p>
</div>
<div id="rTable" class="box"></div>
<div id="rBenefits" class="box"></div>
<p id="rDisc" class="footer"></p>
<button id="rBtn" onclick="restart()"></button>
</div>

</div>
</body>
</html>
