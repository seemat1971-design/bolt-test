<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BOLT Breath Tool</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <div id="lang">
            <h1>BOLT Test</h1>
            <p>Choose your language / भाषा चुनें</p>
            <button onclick="setLang('en')">English</button>
            <button onclick="setLang('hi')">हिंदी</button>
        </div>

        <div id="welcome" class="hidden">
            <h1 id="wTitle"></h1>
            <div id="wBody" style="text-align: left; margin-bottom: 20px;">
                <p id="wText1"></p>
                <p id="wText2"></p>
            </div>
            <button onclick="goInstructions()" id="wBtn"></button>
        </div>

        <div id="instructions" class="hidden">
            <h2 id="iTitle"></h2>
            <div id="iText" class="box"></div>
            <button onclick="goTimer()" id="iBtn"></button>
        </div>

        <div id="timerScreen" class="hidden">
            <h2 id="tTitle"></h2>
            <div id="timer" class="timer">0</div>
            <p id="support"></p>
            <button id="startBtn" onclick="startHold()"></button>
            <button id="stopBtn" class="hidden" onclick="stopHold()"></button>
        </div>

        <div id="result" class="hidden">
            <div id="rTitle"></div>
            <div id="rExplain"></div>
            <div id="rTable"></div>
            <div id="rBenefits"></div>
            <p id="rDisc" class="footer"></p>
            <button id="rBtn" onclick="restart()"></button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
